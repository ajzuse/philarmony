; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32devkitc]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = 
	-DCORE_DEBUG_LEVEL=3
	; USB CDC-on-boot breaks Serial globals on this target/core combo
	-Wall
	-Wextra
	-Wno-unused-parameter
	-Wno-sign-compare
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter =
	+<*>
	-<drivers/actuators/GPIOActuator.cpp>
	-<drivers/actuators/SSRActuator.cpp>
	-<drivers/actuators/ServoActuator.cpp>
	-<drivers/actuators/SharedMosfetActuator.cpp>
	-<drivers/actuators/StepperActuator.cpp>
	-<drivers/display/DisplayManager.cpp>
	-<drivers/display/GC9A01Display.cpp>
	-<drivers/display/HD44780Display.cpp>
	-<drivers/display/ILI9488Display.cpp>
	-<drivers/display/NextionDisplay.cpp>
	-<drivers/display/SH1106Display.cpp>
	-<drivers/display/ST7735Display.cpp>
	-<drivers/sensors/AHT20Sensor.cpp>
	-<drivers/sensors/BME280Sensor.cpp>
	-<drivers/sensors/CustomSensor.cpp>
	-<drivers/sensors/NTCSensor.cpp>
	-<drivers/sensors/SHT3xSensor.cpp>
	-<core/DriverRegistry.cpp>
	-<plugins/PluginManager.cpp>
lib_deps = 
	https://github.com/me-no-dev/AsyncTCP.git#master
	https://github.com/me-no-dev/ESPAsyncWebServer.git#master
	bblanchon/ArduinoJson@^7.0.4
	lovyan03/LovyanGFX@^1.1.8
	paulstoffregen/OneWire@^2.3.1
	adafruit/Adafruit GFX Library
	adafruit/Adafruit SSD1306
	adafruit/Adafruit SH110X
	marcoschwartz/LiquidCrystal_I2C

