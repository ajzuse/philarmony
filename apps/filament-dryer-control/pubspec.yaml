name: filament_dryer_control
description: Philarmony filament dryer control — cross-platform (desktop + mobile).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0 <3.45.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  philarmony_core:
    path: ../../packages/philarmony_core
  web_socket_channel: ^3.0.0
  multicast_dns: ^0.3.2+8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  fl_chart: ^0.70.2
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^18.0.1
  pdf: ^3.11.1
  printing: ^5.13.4
  uuid: ^4.5.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13
  msix: ^3.16.0

msix_config:
  display_name: Philarmony Control
  publisher_display_name: Philarmony
  identity_name: local.philarmony.control
  msix_version: 0.1.0.0
  capabilities: internetClient,privateNetworkClientServer

flutter:
  generate: true
  uses-material-design: true
